<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- macOS System-grade Multi-layer Drop Shadow -->
    <filter id="dockShadow" x="-20%" y="-15%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <!-- Card soft subtle shadow -->
    <filter id="bubbleShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#94A3B8" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#94A3B8" flood-opacity="0.12"/>
    </filter>

    <!-- Lens clean crisp shadow -->
    <filter id="lensShadow" x="-25%" y="-20%" width="155%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F2942" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F2942" flood-opacity="0.12"/>
    </filter>

    <!-- Base Canvas Gradient (Apple Clean Ceramic White) -->
    <linearGradient id="baseBg" x1="512" y1="90" x2="512" y2="914" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FAFCFE"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>

    <!-- Bubble Fill: Warm Ivory -->
    <linearGradient id="bubbleBg" x1="220" y1="190" x2="720" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBF2"/>
      <stop offset="100%" stop-color="#FFF3DB"/>
    </linearGradient>

    <!-- Lens Rim Gradient: Vibrant Blue to Royal Blue -->
    <linearGradient id="lensRim" x1="450" y1="430" x2="730" y2="710" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2B72EE"/>
      <stop offset="100%" stop-color="#1A56DB"/>
    </linearGradient>

    <!-- Lens Handle Gradient -->
    <linearGradient id="handleGrad" x1="675" y1="660" x2="810" y2="795" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7E67"/>
      <stop offset="100%" stop-color="#F4684E"/>
    </linearGradient>
  </defs>

  <!-- 1. Apple macOS Standard 824x824 Squircle Base -->
  <g filter="url(#dockShadow)">
    <rect x="100" y="90" width="824" height="824" rx="185" fill="#FFFFFF"/>
    <rect x="101" y="91" width="822" height="822" rx="184" stroke="#CBD5E1" stroke-width="2" stroke-opacity="0.75"/>
  </g>

  <!-- 2. Minimalist Prompt Bubble (Clean, uncluttered, warm ivory) -->
  <g filter="url(#bubbleShadow)">
    <!-- Bubble Outline & Shape: Rounded card with chat tail -->
    <path d="M230 255C230 216.34 261.34 185 300 185H710C748.66 185 780 216.34 780 255V595C780 633.66 748.66 665 710 665H515L375 790V665H300C261.34 665 230 633.66 230 595V255Z" fill="url(#bubbleBg)" stroke="#E9DEC8" stroke-width="3"/>

    <!-- Simplified Content Lines (Pure Prompt Anatomy, No Clutter) -->
    <!-- Small Category Label Line -->
    <rect x="295" y="255" width="130" height="22" rx="11" fill="#CBD5CE"/>

    <!-- Main Highlighted Instruction Line (Coral Orange) -->
    <rect x="295" y="320" width="310" height="36" rx="18" fill="#F4775E"/>

    <!-- Clean Context Text Lines -->
    <rect x="295" y="395" width="390" height="24" rx="12" fill="#87989C"/>
    <rect x="295" y="448" width="280" height="24" rx="12" fill="#A4B4AC"/>
    <rect x="295" y="501" width="220" height="24" rx="12" fill="#C2CDC5"/>
  </g>

  <!-- 3. Original Iconic Clean Lens (Pure geometry, high clarity, no clutter) -->
  <g filter="url(#lensShadow)">
    <!-- Handle (Smooth rounded bar at 45 deg, vibrant coral orange) -->
    <rect x="662" y="655" width="165" height="52" rx="26" fill="url(#handleGrad)" transform="rotate(45 662 655)"/>

    <!-- Lens Outer Rim (Classic Cobalt Blue) -->
    <circle cx="590" cy="575" r="136" fill="#D8F4FF" stroke="url(#lensRim)" stroke-width="32"/>

    <!-- Lens Inner Iris (Clear Soft Sky Blue) -->
    <circle cx="590" cy="575" r="94" fill="#ADE6F8"/>

    <!-- Clean Lens Specular Highlight (The classic crisp white bubble) -->
    <circle cx="550" cy="535" r="26" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="585" cy="515" r="10" fill="#FFFFFF" fill-opacity="0.75"/>
  </g>
</svg>