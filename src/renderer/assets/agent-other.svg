<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background rounded square gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Border highlight -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.3" />
    </linearGradient>

    <!-- Top facet of isometric cube -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Left facet of isometric cube -->
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Right facet of isometric cube -->
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Glowing ambient center -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0" />
    </radialGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Plate (macOS squircle feel) -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" filter="url(#subtleShadow)" />

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="40" fill="url(#centerGlow)" />

  <!-- Isometric Multi-Agent Modular Cubes -->
  <!-- Central Main Cube -->
  <g transform="translate(64, 62)">
    <!-- Top Face -->
    <polygon points="0,-24 22,-11 0,2 -22,-11" fill="url(#cubeTop)" />
    <!-- Left Face -->
    <polygon points="-22,-11 0,2 0,26 -22,13" fill="url(#cubeLeft)" />
    <!-- Right Face -->
    <polygon points="0,2 22,-11 22,13 0,26" fill="url(#cubeRight)" />

    <!-- Corner Satellite Dots (representing other nodes) -->
    <circle cx="-28" cy="-22" r="3" fill="#94a3b8" opacity="0.8" />
    <circle cx="28" cy="-22" r="3" fill="#94a3b8" opacity="0.8" />
    <circle cx="0" cy="36" r="3" fill="#94a3b8" opacity="0.8" />

    <!-- Connection lines -->
    <line x1="-28" y1="-22" x2="-22" y2="-11" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 2" stroke-opacity="0.6" />
    <line x1="28" y1="-22" x2="22" y2="-11" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 2" stroke-opacity="0.6" />
    <line x1="0" y1="26" x2="0" y2="36" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 2" stroke-opacity="0.6" />
  </g>
</svg>
